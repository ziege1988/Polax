name: Build Polux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release mit der Version aus der Datei VERSION veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          fi

      - name: App bauen
        run: ./scripts/build-app.sh

      - name: Layout-Vorschau rendern
        continue-on-error: true
        run: |
          export POLUX_HOME="$RUNNER_TEMP/polux-preview"
          dist/Polux.app/Contents/MacOS/Polux --render-preview "$RUNNER_TEMP/preview"
          mkdir -p docs/preview
          for f in polaroid gallery settings-sources settings-source-detail settings-collection; do
            [ -f "$RUNNER_TEMP/preview/$f.png" ] || continue
            sips -s format jpeg -s formatOptions 80 -Z 1400 "$RUNNER_TEMP/preview/$f.png" --out "docs/preview/$f.jpg" >/dev/null
          done
          ls -la docs/preview

      - name: Vorschau im Branch ablegen
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview
          if git diff --cached --quiet; then
            echo "Vorschau unverändert"
          else
            git commit -m "Vorschau aktualisieren [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" || echo "Push der Vorschau übersprungen"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Polux-${{ env.VERSION }}
          path: dist/Polux-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vorschau
          path: ${{ runner.temp }}/preview/*.png

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – lade ZIP neu hoch."
            gh release upload "$TAG" dist/Polux-*.zip --clobber
          else
            gh release create "$TAG" dist/Polux-*.zip \
              --target "$GITHUB_SHA" \
              --title "Polux $VERSION" \
              --notes-file docs/release-notes.md \
              --latest
          fi
