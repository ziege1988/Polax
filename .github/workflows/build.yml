name: Build Polux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          fi

      - name: App bauen
        run: ./scripts/build-app.sh

      - name: Layout-Vorschau rendern
        run: |
          export POLUX_HOME="$RUNNER_TEMP/polux-preview"
          dist/Polux.app/Contents/MacOS/Polux --render-preview "$RUNNER_TEMP/preview"
          ls -la "$RUNNER_TEMP/preview"
          for f in polaroid gallery; do
            sips -s format jpeg -s formatOptions 55 -Z 760 "$RUNNER_TEMP/preview/$f.png" --out "$RUNNER_TEMP/preview/$f.jpg" >/dev/null
            echo "----BEGIN $f----"
            base64 -i "$RUNNER_TEMP/preview/$f.jpg" | tr -d '\n'
            echo
            echo "----END $f----"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Polux-${{ env.VERSION }}
          path: dist/Polux-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vorschau
          path: ${{ runner.temp }}/preview/*.png

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Polux-*.zip \
            --title "Polux $VERSION" --generate-notes
